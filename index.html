<!doctype html>
<html lang="de" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Remix Household Chore Tracker</title>
    <meta name="description" content="Gamifizierter, minimalistischer Haushalts-Manager mit Netflix-Style Profilauswahl, Rollenkonzept (Moritz als Admin), Punkterechner und dynamischen Wochenzielen." />
    <meta property="og:title" content="Remix Household Chore Tracker" />
    <meta property="og:description" content="Gamifizierter, minimalistischer Haushalts-Manager mit Netflix-Style Profilauswahl, Rollenkonzept (Moritz als Admin), Punkterechner und dynamischen Wochenzielen." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Haushalt" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('Window Error:', msg, url, lineNo, columnNo, error);
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding: 20px; color: red; font-family: sans-serif;">' +
            '<h2>App konnte nicht geladen werden</h2>' +
            '<p>' + msg + '</p>' +
            '<pre style="font-size: 12px;">' + url + ':' + lineNo + '</pre>' +
            '<button onclick="window.location.reload()" style="padding: 8px 16px; border-radius: 8px; background: #4f46e5; color: white; border: none; cursor: pointer;">Neu laden</button>' +
            '</div>';
        }
        return false;
      };
    </script>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-900 dark:text-slate-50 transition-colors duration-200">
    <!-- Minimalist Inline Loader (OUTSIDE root to prevent React from deleting it too early) -->
    <div id="app-loading" style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #f8fafc; flex-direction: column; gap: 16px; transition: opacity 0.5s ease-out;">
      <div style="width: 40px; height: 40px; border: 4px solid #f1f5f9; border-top: 4px solid #4f46e5; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="color: #64748b; font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px;">Haushalt Tracker lädt...</p>
    </div>

    <div id="root" class="min-h-full flex flex-col"></div>
    
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script type="module" src="./src/main.tsx"></script>
    
    <script>
      // FAIL-SAFE: If React doesn't mount and hide the loader within 5 seconds, 
      // we assume a crash and show a recovery interface.
      setTimeout(function() {
        var loader = document.getElementById('app-loading');
        var root = document.getElementById('root');
        
        // If loader is still fully visible
        if (loader && loader.style.display !== 'none' && loader.parentNode) {
          loader.style.background = '#ffffff';
          loader.innerHTML = '<div style="padding: 32px; text-align: center; max-width: 400px; font-family: system-ui, -apple-system, sans-serif;">' +
            '<div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>' +
            '<h2 style="color: #1e293b; margin: 0 0 12px 0; font-size: 24px; font-weight: 800;">Start-Problem</h2>' +
            '<p style="color: #64748b; font-size: 15px; line-height: 1.6; margin-bottom: 32px;">Die App konnte nicht geladen werden. Das liegt meist an blockierten Scripten oder veralteten Browser-Daten.</p>' +
            '<div style="display: flex; flex-direction: column; gap: 12px;">' +
            '<button onclick="location.reload()" style="padding: 16px; background: #4f46e5; color: white; border: none; border-radius: 16px; cursor: pointer; font-weight: 700; font-size: 15px;">Seite neu laden</button>' +
            '<button onclick="localStorage.clear(); sessionStorage.clear(); location.reload();" style="padding: 16px; background: #f1f5f9; color: #475569; border: none; border-radius: 16px; cursor: pointer; font-weight: 600; font-size: 15px;">Daten-Cache löschen</button>' +
            '</div>' +
            '<p style="margin-top: 24px; font-size: 12px; color: #94a3b8;">Falls das Problem weiterhin besteht, prüfen Sie die Internetverbindung.</p>' +
            '</div>';
        }
      }, 5000);
    </script>
  </body>
</html>
