<!doctype html>
<html lang="de" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Remix Household Chore Tracker</title>
    <meta name="description" content="Gamifizierter, minimalistischer Haushalts-Manager mit Netflix-Style Profilauswahl, Rollenkonzept (Moritz als Admin), Punkterechner und dynamischen Wochenzielen." />
    <meta property="og:title" content="Remix Household Chore Tracker" />
    <meta property="og:description" content="Gamifizierter, minimalistischer Haushalts-Manager mit Netflix-Style Profilauswahl, Rollenkonzept (Moritz als Admin), Punkterechner und dynamischen Wochenzielen." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Haushalt" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('Window Error:', msg, url, lineNo, columnNo, error);
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding: 20px; color: red; font-family: sans-serif;">' +
            '<h2>App konnte nicht geladen werden</h2>' +
            '<p>' + msg + '</p>' +
            '<pre style="font-size: 12px;">' + url + ':' + lineNo + '</pre>' +
            '<button onclick="window.location.reload()" style="padding: 8px 16px; border-radius: 8px; background: #4f46e5; color: white; border: none; cursor: pointer;">Neu laden</button>' +
            '</div>';
        }
        return false;
      };
    </script>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-900 dark:text-slate-50 transition-colors duration-200">
    <div id="root" class="min-h-full flex flex-col">
      <div id="app-loading" style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; flex-direction: column; gap: 16px;">
        <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="color: #64748b; font-weight: 500;">Lade Haushalt Tracker...</p>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="src/main.tsx"></script>
    <script>
      // Safety timeout: If app hasn't loaded in 8 seconds, show help
      setTimeout(function() {
        var loading = document.getElementById('app-loading');
        if (loading && loading.parentNode) {
          var help = document.createElement('div');
          help.style.padding = '20px';
          help.style.textAlign = 'center';
          help.style.color = '#64748b';
          help.style.fontFamily = 'sans-serif';
          help.innerHTML = '<p style="margin-bottom: 10px;">Laden dauert ungewöhnlich lange...</p>' +
            '<div style="display: flex; gap: 8px; justify-content: center;">' +
            '<button onclick="window.location.reload()" style="padding: 8px 16px; border-radius: 8px; background: #4f46e5; color: white; border: none; cursor: pointer;">Neu laden</button>' +
            '<button onclick="localStorage.clear(); window.location.reload();" style="padding: 8px 16px; border-radius: 8px; background: #ef4444; color: white; border: none; cursor: pointer;">Cache leeren</button>' +
            '</div>';
          loading.appendChild(help);
        }
      }, 8000);
    </script>
  </body>
</html>
