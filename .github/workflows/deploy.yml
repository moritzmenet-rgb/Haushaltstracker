name: Redirect GitHub Pages to fishandwish.web.app

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build project (check only, the app is served by Firebase Hosting)
        run: npm run build

      # The app lives at https://fishandwish.web.app (deployed with `firebase deploy --only hosting`).
      # This GitHub Pages address only forwards there.
      - name: Prepare redirect site
        run: |
          mkdir -p ./redirect
          cp tools/redirect/index.html ./redirect/index.html
          cp tools/redirect/index.html ./redirect/404.html
          cp tools/redirect/sw.js ./redirect/sw.js
          touch ./redirect/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './redirect'
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

