<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish &amp; Wish ist umgezogen</title>
<meta http-equiv="refresh" content="2; url=https://fishandwish.web.app/">
<link rel="canonical" href="https://fishandwish.web.app/">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f6f5f2; color: #1c1b19; }
  main { max-width: 360px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 16px; line-height: 1.5; color: #57534e; }
  a { display: inline-block; padding: 12px 20px; border-radius: 10px; background: #1c1b19; color: #fff; text-decoration: none; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1b19; color: #f6f5f2; } p { color: #a8a29e; } a { background: #f6f5f2; color: #1c1b19; }
  }
</style>
</head>
<body>
<main>
  <h1>Fish &amp; Wish ist umgezogen</h1>
  <p>Die neue Adresse ist <strong>fishandwish.web.app</strong>. Du wirst gleich weitergeleitet.</p>
  <a href="https://fishandwish.web.app/">Zur neuen Adresse</a>
</main>
<script>
  // remove the old app's service worker on this address, then go to the new one
  (async () => {
    try {
      const regs = await navigator.serviceWorker?.getRegistrations?.() ?? [];
      await Promise.all(regs.map((r) => r.unregister()));
      const keys = await caches?.keys?.() ?? [];
      await Promise.all(keys.map((k) => caches.delete(k)));
    } catch (e) {}
    location.replace('https://fishandwish.web.app/');
  })();
</script>
</body>
</html>
